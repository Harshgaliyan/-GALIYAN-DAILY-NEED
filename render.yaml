services:
  - type: web
    name: galiyan-api
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    disk:
      name: galiyan-data
      mountPath: /var/data/galiyan
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data/galiyan
      - key: UPLOAD_DIR
        value: /var/data/galiyan/uploads
      - key: CORS_ORIGIN
        value: https://harshgaliyan.github.io
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
